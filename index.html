<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<link rel="manifest" href="manifest.webmanifest">
<title>Taxi Tracker FCO</title>
<style>
:root{--bg:#050505;--card:#101112;--card2:#17181a;--line:#2b2d30;--text:#f5f5f5;--muted:#9b9da1;--yellow:#ffd21a;--green:#25d366;--red:#ef4444}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}button,input,select{font:inherit}
.app{max-width:650px;margin:auto;padding:12px 12px 92px}
.header{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 14px}.brand{display:flex;align-items:center;gap:10px}.taxiIcon{font-size:31px}.title{font-size:22px;font-weight:800}.subtitle{font-size:12px;color:var(--muted)}
.gear{border:0;background:var(--card2);color:white;border-radius:12px;width:42px;height:42px;font-size:20px}
.card{background:linear-gradient(145deg,#111315,#0b0c0d);border:1px solid #202225;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 8px 24px #0008}
.shiftTop{display:flex;justify-content:space-between;align-items:center}.status{font-weight:700}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-left:5px}
.bigtime{text-align:center;font-size:34px;font-weight:800;margin:13px 0 2px;font-variant-numeric:tabular-nums}.center{text-align:center}
.row{display:flex;gap:8px}.row>*{flex:1}
button{border:1px solid var(--line);border-radius:13px;padding:12px 10px;background:var(--card2);color:var(--text);font-weight:750}
button.yellow,.yellow{background:var(--yellow);color:#111;border-color:var(--yellow)}button.red{background:#8f2020;border-color:#b72a2a;color:white}
button:active{transform:scale(.98)}.hidden{display:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#111315;border:1px solid #202225;border-radius:15px;padding:12px}.label{font-size:12px;color:var(--muted)}.value{font-size:20px;font-weight:800;margin-top:4px}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:17px;margin-bottom:10px}
.smallBtn{width:auto;padding:8px 11px;font-size:12px}.muted{color:var(--muted);font-size:13px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick button{padding:18px 8px;font-size:15px}.quick span{display:block;font-size:24px;margin-bottom:5px}
input,select{width:100%;background:#0d0f10;color:white;border:1px solid #34363a;padding:13px;border-radius:13px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:5px}
.amountRow{display:flex;gap:7px;margin-top:8px}.amountRow button{padding:9px 5px;font-size:13px}
.pay{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.pay button{font-size:12px;padding:11px 4px}.pay button.active{background:var(--yellow);color:#111;border-color:var(--yellow)}
.plane{border:1px solid #25272a;background:#0d0f10;border-radius:13px;padding:12px;margin:7px 0}.planeHead{display:flex;justify-content:space-between}.green{color:var(--green)}.yellowText{color:var(--yellow)}
.trip{padding:11px 0;border-bottom:1px solid #222}.trip:last-child{border-bottom:0}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(650px,100%);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#08090aee;backdrop-filter:blur(15px);border-top:1px solid #202225;display:grid;grid-template-columns:repeat(5,1fr);z-index:5}.nav button{border:0;background:transparent;padding:7px 2px;font-size:11px;color:#8f9297}.nav button.active{color:var(--yellow)}.navIcon{font-size:20px;display:block;margin-bottom:2px}
.notice{padding:9px 11px;border-radius:12px;background:#17181a;color:var(--muted);font-size:12px}

.flightInfo{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
.flightPill{display:flex;gap:8px;align-items:center;background:#17181a;border:1px solid #2b2d30;border-radius:12px;padding:9px 11px}
.flightPill b{color:#25d366;font-size:12px}
.flightSource{background:#080909;border:1px solid #2b2d30;border-radius:14px;overflow:hidden}
.flightSource iframe{display:block;width:100%;height:520px;border:0;background:#050505}
.flightActions{margin-top:10px}
.yellowBtn{display:block;text-align:center;background:#ffd21a;color:#050505;text-decoration:none;font-weight:800;padding:12px;border-radius:12px}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="brand"><div class="taxiIcon">🚕</div><div><div class="title">TAXI TRACKER FCO</div><div class="subtitle">Roma · Fiumicino</div></div></div><button class="gear">⚙️</button></header>

<section class="card" id="flightCard">
  <div class="row" style="justify-content:space-between;align-items:center">
    <div>
      <div class="eyebrow">✈️ FIUMICINO</div>
      <h2 style="margin:4px 0 0">Arrivi</h2>
    </div>
    <button class="small yellow" id="refreshFlights">↻ Aggiorna</button>
  </div>

  <div class="flightTabs">
    <button class="flightTab active" data-flight-tab="live">🔴 Adesso</button>
    <button class="flightTab" data-flight-tab="next">🟡 Prossima ora</button>
    <button class="flightTab" data-flight-tab="later">🟢 1–2 ore</button>
  </div>

  <div class="flightMeta">
    <span id="flightStatus">Fonte gratuita · Fiumicino.it</span>
    <span id="flightClock"></span>
  </div>

  <div id="flights" class="flightList">
    <div class="notice">
      <b>Arrivi Fiumicino</b><br>
      Tocca una fascia per aprire il tabellone aggiornato della fonte gratuita.
    </div>
  </div>

  <div class="flightActions">
    <a class="yellowBtn" id="openFlights" href="https://www.fiumicino.it/arrivi" target="_blank" rel="noopener">✈️ Apri arrivi aggiornati</a>
    <a class="darkBtn" href="https://www.fiumicino.it/adesso" target="_blank" rel="noopener">📡 Aerei in arrivo adesso</a>
  </div>
</section>

<section class="card"><div class="sectionTitle">💶 Incassi per metodo</div><div id="methods"></div></section>
<section class="card"><div class="sectionTitle">🧾 Corse di oggi</div><div id="list" class="muted">Nessuna corsa.</div></section>
</div>

<nav class="nav">
<button class="active"><span class="navIcon">⌂</span>Home</button>
<button><span class="navIcon">🚕</span>Corse</button>
<button><span class="navIcon">✈️</span>Fiumicino</button>
<button><span class="navIcon">▥</span>Statistiche</button>
<button><span class="navIcon">•••</span>Altro</button>
</nav>

<script>
"use strict";
const $=id=>document.getElementById(id),KEY="taxi_tracker_fco_v9";
let raw=localStorage.getItem(KEY), old=null;
if(!raw){
  for(const k of ["taxi_tracker_fco_v6","taxi_tracker_fco_v5","taxi_tracker_fco_v4"]){
    const v=localStorage.getItem(k);
    if(v){try{old=JSON.parse(v);break}catch(e){}}
  }
}
let s=raw?JSON.parse(raw):old||{shift:null,shifts:[],rides:[]},ride=null,selectedPay="Contanti";
if(!Array.isArray(s.rides))s.rides=[];
if(!Array.isArray(s.shifts))s.shifts=[];
if(s.shift){
  s.shifts.push({...s.shift});
  s.shift=null;
}
s.rides=s.rides.map(x=>({...x,payment:x.payment==="Uber"?"UBER":x.payment}));
const euro=n=>new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(n||0);
const fmt=s=>{s=Math.max(0,Math.floor(s||0));let h=Math.floor(s/3600),m=Math.floor(s%3600/60),q=s%60;return h?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(q).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(q).padStart(2,"0")}`};
const dayKey=d=>new Date(d).toLocaleDateString("it-IT");
const today=()=>s.rides.filter(x=>dayKey(x.end)===dayKey(Date.now()));
const todayShifts=()=>s.shifts.filter(x=>dayKey(x.start)===dayKey(Date.now()));
function work(){
  let total=todayShifts().reduce((a,x)=>{
    const end=x.end||Date.now();
    return a+Math.max(0,(end-x.start)/1000-(x.pausedSec||0));
  },0);
  if(s.shift){
    const end=s.shift.active?Date.now():s.shift.end;
    total+=Math.max(0,(end-s.shift.start)/1000-(s.shift.pausedSec||0)-(s.shift.paused&&s.shift.pauseAt?(Date.now()-s.shift.pauseAt)/1000:0));
  }
  return Math.max(0,total);
}
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function kmValue(id){const n=parseFloat($(id).value);return Number.isFinite(n)?n:null}
function render(){
  let rs=today(),inc=rs.reduce((a,x)=>a+x.amount,0),w=work();
  $("income").textContent=euro(inc);
  $("rides").textContent=rs.length;
  $("hours").textContent=fmt(w);
  $("hourly").textContent=euro(w?inc/(w/3600):0);
  $("avg").textContent=euro(rs.length?inc/rs.length:0);
  $("avgDur").textContent=fmt(rs.length?rs.reduce((a,x)=>a+x.duration,0)/rs.length:0);

  $("shift").textContent=s.shift?.active?(s.shift.paused?"▶ Riprendi":"■ Fine turno"):"▶ Nuovo turno";
  $("shift").className=s.shift?.active?"red":"yellow";
  $("pause").classList.toggle("hidden",!s.shift?.active);
  $("pause").textContent=s.shift?.paused?"▶ Riprendi":"⏸ Pausa";
  $("status").innerHTML=s.shift?.active?(s.shift.paused?"Pausa":"In corso")+" <span class='dot'></span>":"Non attivo";
  $("startText").textContent=s.shift?.active
    ?"Iniziato alle "+new Date(s.shift.start).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})
    :(todayShifts().length?"Pronto per un nuovo turno":"Pronto per iniziare");

  $("bigTime").textContent=fmt(w);

  if(s.shift){
    $("kmStart").value=s.shift.kmStart??"";
    $("kmEnd").value=s.shift.kmEnd??"";
    const ks=Number(s.shift.kmStart),ke=Number(s.shift.kmEnd);
    $("kmDone").textContent=(Number.isFinite(ks)&&Number.isFinite(ke)&&ke>=ks)?((ke-ks).toFixed(1).replace(".",",")+" km"):"0 km";
  }else{
    $("kmStart").value="";
    $("kmEnd").value="";
    $("kmDone").textContent="0 km";
  }

  let m={Contanti:0,POS:0,AppItTaxi:0,UBER:0,Buoni:0};
  rs.forEach(x=>m[x.payment]=(m[x.payment]||0)+x.amount);
  $("methods").innerHTML=Object.entries(m).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:7px 0"><span>${k}</span><b>${euro(v)}</b></div>`).join("");
  $("list").innerHTML=rs.length
    ?rs.slice().reverse().map(x=>`<div class="trip"><b>${euro(x.amount)}</b> · ${x.payment}<br><span class="muted">${new Date(x.end).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})} · ${fmt(x.duration)}</span></div>`).join("")
    :"Nessuna corsa.";
}

$("shift").onclick=()=>{
  if(s.shift?.active){
    const ke=kmValue("kmEnd");
    if(s.shift.kmStart!==null&&s.shift.kmStart!==undefined&&ke===null){
      alert("Inserisci i km finali prima di terminare il turno.");$("kmEnd").focus();return;
    }
    if(ke!==null&&s.shift.kmStart!==null&&s.shift.kmStart!==undefined&&ke<s.shift.kmStart){
      alert("I km finali non possono essere inferiori ai km iniziali.");return;
    }
    if(s.shift.paused){
      s.shift.pausedSec+=(Date.now()-s.shift.pauseAt)/1000;
      s.shift.paused=false;s.shift.pauseAt=null;
    }
    s.shift.kmEnd=ke;
    s.shift.active=false;s.shift.end=Date.now();
    s.shifts.push({...s.shift});
    s.shift=null;
  }else{
    const ks=kmValue("kmStart");
    s.shift={active:true,start:Date.now(),end:null,paused:false,pauseAt:null,pausedSec:0,kmStart:ks,kmEnd:null};
  }
  save();render();
};

$("kmStart").addEventListener("change",()=>{
  if(s.shift?.active){
    const v=kmValue("kmStart");
    if(v!==null)s.shift.kmStart=v;
    save();render();
  }
});
$("kmEnd").addEventListener("change",()=>{
  if(s.shift?.active){
    const v=kmValue("kmEnd");
    if(v!==null)s.shift.kmEnd=v;
    save();render();
  }
});
$("pause").onclick=()=>{
  if(!s.shift?.active)return;
  if(s.shift.paused){
    s.shift.pausedSec+=(Date.now()-s.shift.pauseAt)/1000;
    s.shift.paused=false;s.shift.pauseAt=null;
  }else{
    s.shift.paused=true;s.shift.pauseAt=Date.now();
  }
  save();render();
};

$("take").onclick=()=>{
  if(!s.shift?.active||s.shift.paused){alert(s.shift?.paused?"Il turno è in pausa.":"Prima inizia il turno.");return}
  if(!ride)ride={start:Date.now()};
  $("rideBox").classList.remove("hidden");$("rideTimer").textContent="00:00";$("take").classList.add("yellow");
};
$("client").onclick=()=>{if(!ride){alert("Prima premi Corsa presa.");return}ride.client=true;$("client").classList.add("yellow")};
$("finish").onclick=()=>{if(!ride){alert("Prima premi Corsa presa.");return}$("rideBox").classList.remove("hidden");$("amount").focus()};
$("openAmount").onclick=()=>{if(!ride){alert("Prima premi Corsa presa.");return}$("rideBox").classList.remove("hidden");$("amount").focus()};
document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{$("amount").value=b.dataset.a});
document.querySelectorAll("#pay button").forEach(b=>b.onclick=()=>{
  selectedPay=b.dataset.p;
  document.querySelectorAll("#pay button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  $("selectedPayment").textContent="Pagamento selezionato: "+selectedPay;
});
$("saveRide").onclick=()=>{
  if(!ride)return;
  let end=Date.now(),a=parseFloat($("amount").value)||0;
  s.rides.push({start:ride.start,end,duration:(end-ride.start)/1000,amount:a,payment:selectedPay});
  ride=null;$("rideBox").classList.add("hidden");$("rideTimer").textContent="00:00";$("amount").value="";
  $("take").classList.remove("yellow");$("client").classList.remove("yellow");save();render();
};
$("cancel").onclick=()=>{ride=null;$("rideBox").classList.add("hidden");$("rideTimer").textContent="00:00"};
let flightTab="live";
const flightData=[
  {time:"—",code:"LIVE",route:"Aerei osservati in zona FCO",state:"Apri fonte live",cls:"live"},
  {time:"—",code:"FCO",route:"Arrivi programmati / aggiornati",state:"Tabellone",cls:"done"},
  {time:"—",code:"FCO",route:"Arrivi delle prossime 1–2 ore",state:"Tabellone",cls:"done"}
];
function renderFlights(){
  const i=flightTab==="live"?0:flightTab==="next"?1:2;
  const x=flightData[i];
  $("flights").innerHTML=`
    <div class="flightRow">
      <div class="flightTime">${x.time}</div>
      <div class="flightMain"><b>${x.code}</b><span>${x.route}</span></div>
      <div class="flightState ${x.cls}">${x.state}</div>
    </div>
    <div class="notice" style="margin-top:8px">
      I dati live vengono aperti direttamente dalla fonte gratuita per evitare di mostrare informazioni vecchie nella PWA.
    </div>`;
  $("flightClock").textContent=new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
}
document.querySelectorAll(".flightTab").forEach(b=>b.onclick=()=>{
  flightTab=b.dataset.flightTab;
  document.querySelectorAll(".flightTab").forEach(x=>x.classList.toggle("active",x===b));
  renderFlights();
});
$("refreshFlights").onclick=()=>{renderFlights();window.open(flightTab==="live"?"https://www.fiumicino.it/adesso":"https://www.fiumicino.it/arrivi","_blank")};
renderFlights();
setInterval(()=>{$("flightClock").textContent=new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})},15000);

setInterval(()=>{
  if(ride)$("rideTimer").textContent=fmt((Date.now()-ride.start)/1000);
  render();
},1000);
save();render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
